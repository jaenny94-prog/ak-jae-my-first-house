<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>부동산 악재 생존기: 제1편 첫 집 마련 10년의 여정</title>
  <meta name="description" content="첫 집 마련 과정에서 겪는 실전 부동산 법률 및 금융 악재 시뮬레이션 게임" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    };
  </script>

  <style>
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    input[type=range] {
      accent-color: #6366f1;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-[100dvh] flex flex-col font-sans antialiased overflow-x-hidden">

  <!-- ================= HEADER ================= -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-2.5">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-xl">🏢</span>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="text-sm font-bold tracking-tight text-white">부동산 악재 생존기</h1>
            <span class="text-[10px] bg-indigo-600/30 text-indigo-400 border border-indigo-500/30 px-1.5 py-0.5 rounded font-mono font-medium">제1편 첫집마련</span>
          </div>
          <p id="top-char-summary" class="text-[11px] text-slate-400">가구 프로필 설정 대기 중</p>
        </div>
      </div>

      <!-- Realtime Metric Badges -->
      <div id="status-badges" class="flex items-center space-x-3 text-xs hidden">
        <div class="flex flex-col items-end">
          <span class="text-[10px] text-slate-400">보유 순자산</span>
          <span id="badge-networth" class="font-bold text-emerald-400 font-mono">0억</span>
        </div>
        <div class="h-6 w-[1px] bg-slate-800"></div>
        <div class="flex flex-col items-end">
          <span class="text-[10px] text-slate-400">멘탈 게이지</span>
          <div class="flex items-center space-x-1">
            <div class="w-16 bg-slate-800 h-2 rounded-full overflow-hidden">
              <div id="badge-mental-bar" class="bg-indigo-500 h-full rounded-full transition-all duration-300" style="width: 100%"></div>
            </div>
            <span id="badge-mental-val" class="font-bold font-mono text-slate-300">100</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ================= MAIN ================= -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 pb-24 md:pb-8 flex flex-col justify-center">

    <!-- SCREEN 1: CHARACTER & PROFILE SETUP -->
    <section id="screen-setup" class="space-y-6">
      <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-5 md:p-7 shadow-xl backdrop-blur-sm">
        <div class="border-b border-slate-800 pb-4 mb-5">
          <h2 class="text-lg md:text-xl font-bold text-white flex items-center gap-2">
            <span>👤</span> 가구 생애주기 & 직주근접 설정
          </h2>
          <p class="text-xs md:text-sm text-slate-400 mt-1">혼인 여부, 맞벌이 소득, 육아휴직 및 통근 권역을 정밀하게 반영합니다.</p>
        </div>

        <!-- 1. Job Selection -->
        <div class="mb-5">
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
            본인 직업군 & 기본 소득
          </label>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5">
            <button type="button" onclick="setJob('public')" id="job-public" class="job-btn p-3 rounded-xl border border-indigo-600 bg-indigo-950/40 text-left transition">
              <div class="text-sm font-bold">🏛️ 공무원/교사</div>
              <div class="text-[11px] text-indigo-300 font-medium mt-0.5">연 4,800만원</div>
              <div class="text-[10px] text-slate-400">호봉제 / 육휴 안정</div>
            </button>
            <button type="button" onclick="setJob('corp')" id="job-corp" class="job-btn p-3 rounded-xl border border-slate-800 bg-slate-900/80 text-left transition">
              <div class="text-sm font-bold">🏢 대기업 정규직</div>
              <div class="text-[11px] text-emerald-400 font-medium mt-0.5">연 8,500만원</div>
              <div class="text-[10px] text-slate-400">고소득 / 성과급 변동</div>
            </button>
            <button type="button" onclick="setJob('sme')" id="job-sme" class="job-btn p-3 rounded-xl border border-slate-800 bg-slate-900/80 text-left transition">
              <div class="text-sm font-bold">🏭 중견·중소기업</div>
              <div class="text-[11px] text-amber-400 font-medium mt-0.5">연 3,900만원</div>
              <div class="text-[10px] text-slate-400">정책대출 특례 대상</div>
            </button>
            <button type="button" onclick="setJob('freelancer')" id="job-freelancer" class="job-btn p-3 rounded-xl border border-slate-800 bg-slate-900/80 text-left transition">
              <div class="text-sm font-bold">💻 프리랜서/사업</div>
              <div class="text-[11px] text-purple-400 font-medium mt-0.5">연 5,800만원</div>
              <div class="text-[10px] text-slate-400">종소세 증빙 / 현금형</div>
            </button>
          </div>
        </div>

        <!-- 2. Age Slider -->
        <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/80 mb-5">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs text-slate-300 font-semibold">내 현재 나이</span>
            <span id="label-age" class="text-sm font-bold text-indigo-400 font-mono">32세</span>
          </div>
          <input type="range" id="input-age" min="26" max="48" value="32" oninput="updateAge()" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer" />
        </div>

        <!-- 3. Marital Status & Dual Income & Children Section -->
        <div class="bg-slate-950/60 p-4 md:p-5 rounded-xl border border-slate-800 mb-5 space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
              혼인 상태
            </label>
            <div class="grid grid-cols-2 gap-2.5">
              <button type="button" onclick="setMarital('single')" id="marital-single" class="marital-btn py-2.5 px-3 rounded-xl border border-slate-800 bg-slate-900 text-xs font-bold text-slate-300 transition">
                💍 미혼 (1인 가구)
              </button>
              <button type="button" onclick="setMarital('married')" id="marital-married" class="marital-btn py-2.5 px-3 rounded-xl border border-indigo-600 bg-indigo-950/50 text-xs font-bold text-white transition">
                👨‍👩‍👧 기혼 (신혼·다자녀)
              </button>
            </div>
          </div>

          <!-- Married Details (Dynamic) -->
          <div id="married-options" class="space-y-4 pt-2 border-t border-slate-800/80">
            <!-- Dual Income vs Single Income -->
            <div>
              <label class="block text-xs text-slate-400 mb-1.5">가구 소득 형태</label>
              <div class="grid grid-cols-2 gap-2.5">
                <button type="button" onclick="setIncomeType('single')" id="income-single" class="income-btn py-2 px-3 rounded-lg border border-slate-800 bg-slate-900 text-xs text-slate-300">
                  외벌이 (배우자 전업)
                </button>
                <button type="button" onclick="setIncomeType('dual')" id="income-dual" class="income-btn py-2 px-3 rounded-lg border border-emerald-500 bg-emerald-950/40 text-xs font-bold text-emerald-300">
                  맞벌이 (합산 DSR 적용)
                </button>
              </div>
            </div>

            <!-- Spouse Income Input -->
            <div id="spouse-income-box" class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-900/60 p-3 rounded-lg border border-slate-800">
              <div>
                <label class="block text-[11px] text-slate-400 mb-1">배우자 연소득 (만원)</label>
                <input type="number" id="input-spouse-income" value="4500" step="500" oninput="updateIncomeCalc()" class="w-full bg-slate-950 border border-slate-700 p-2 rounded text-white text-xs font-mono" />
              </div>
              <div class="flex flex-col justify-center">
                <span class="text-[11px] text-slate-400">부부 합산 연소득</span>
                <span id="label-total-income" class="text-sm font-bold text-emerald-400 font-mono mt-0.5">9,300만 원</span>
              </div>
            </div>

            <!-- Children Count -->
            <div>
              <label class="block text-xs text-slate-400 mb-1.5">자녀 계획 / 현황</label>
              <div class="grid grid-cols-4 gap-2">
                <button type="button" onclick="setChildCount(0)" id="child-btn-0" class="child-btn py-2 rounded-lg border border-slate-800 bg-slate-900 text-xs font-bold text-slate-400">자녀 0명</button>
                <button type="button" onclick="setChildCount(1)" id="child-btn-1" class="child-btn py-2 rounded-lg border border-indigo-600 bg-indigo-950/50 text-xs font-bold text-white">자녀 1명</button>
                <button type="button" onclick="setChildCount(2)" id="child-btn-2" class="child-btn py-2 rounded-lg border border-slate-800 bg-slate-900 text-xs font-bold text-slate-400">자녀 2명</button>
                <button type="button" onclick="setChildCount(3)" id="child-btn-3" class="child-btn py-2 rounded-lg border border-slate-800 bg-slate-900 text-xs font-bold text-slate-400">자녀 3명</button>
              </div>
            </div>

            <!-- Parental Leave Selection -->
            <div id="leave-option-box">
              <label class="block text-xs text-slate-400 mb-1.5">
                출산 시 육아휴직 계획 <span class="text-rose-400 font-semibold">(소득 급감 & 주담대 원리금 위험)</span>
              </label>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <button type="button" onclick="setLeaveType('none')" id="leave-btn-none" class="leave-btn p-2 rounded-lg border border-slate-800 bg-slate-900 text-left">
                  <div class="text-xs font-bold text-slate-300">휴직 미사용</div>
                  <div class="text-[10px] text-slate-400 mt-0.5">양가 조모 양육/입주 베이비시터</div>
                </button>
                <button type="button" onclick="setLeaveType('one')" id="leave-btn-one" class="leave-btn p-2 rounded-lg border border-indigo-600 bg-indigo-950/50 text-left">
                  <div class="text-xs font-bold text-indigo-300">한 명만 1년 사용</div>
                  <div class="text-[10px] text-slate-400 mt-0.5">휴직자 급여 상한 160만 원 토막</div>
                </button>
                <button type="button" onclick="setLeaveType('both')" id="leave-btn-both" class="leave-btn p-2 rounded-lg border border-slate-800 bg-slate-900 text-left">
                  <div class="text-xs font-bold text-rose-300">부부 순차/동시 2년</div>
                  <div class="text-[10px] text-slate-400 mt-0.5">가계 수입 절반 증발 (상환 고비)</div>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- 4. Expanded Transit & Workplace Hubs (8 Options) -->
        <div class="mb-5">
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
            직주근접 권역 & 통근 노선망 (매물 후보지 및 시세 결정)
          </label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
            
            <label class="flex items-start p-3 rounded-xl border border-indigo-600 bg-indigo-950/20 cursor-pointer hover:border-indigo-400 transit-label">
              <input type="radio" name="work_hub" value="pangyo" checked class="mt-1 mr-2.5 text-indigo-600 focus:ring-0" />
              <div>
                <div class="font-bold text-white">판교·분당 테크노밸리</div>
                <div class="text-[11px] text-indigo-300">신분당선 · 수인분당선 (정자/판교/수지)</div>
                <div class="text-[10px] text-slate-400">8.2억 준신축 (평균 대출 4억)</div>
              </div>
            </label>

            <label class="flex items-start p-3 rounded-xl border border-slate-800 bg-slate-950/40 cursor-pointer hover:border-indigo-400 transit-label">
              <input type="radio" name="work_hub" value="samsung" class="mt-1 mr-2.5 text-indigo-600 focus:ring-0" />
              <div>
                <div class="font-bold text-white">삼성전자 (기흥·화성·평택)</div>
                <div class="text-[11px] text-indigo-300">GTX-A · 1호선 · 동탄인덕원선 (동탄/영통/고덕)</div>
                <div class="text-[10px] text-slate-400">7.4억 신축 (평균 대출 3.5억)</div>
              </div>
            </label>

            <label class="flex items-start p-3 rounded-xl border border-slate-8
